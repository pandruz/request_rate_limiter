name: request_rate_limiter
description: >-
  A token-bucket rate limiter for Dio and http. Allows bursts, enforces a
  steady request rate, queues excess requests, and supports per-host limits,
  request costs and cancellation.
version: 0.3.0
repository: https://github.com/pandruz/request_rate_limiter
issue_tracker: https://github.com/pandruz/request_rate_limiter/issues
topics:
  - dio
  - http
  - rate-limiting
  - throttle
  - interceptor

environment:
  sdk: ^3.0.0

dependencies:
  dio: ^5.4.0
  http: ^1.5.0
  meta: ^1.9.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.24.0
